<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 순례 게임 아이콘: 해 질 녘 언덕을 넘어 굽이진 길, 그 위에 지팡이를 든 순례자와 발자국 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a1a"/><stop offset=".62" stop-color="#b9783e"/><stop offset="1" stop-color="#e9b86a"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2c8"/><stop offset=".55" stop-color="#f6cf7c"/><stop offset="1" stop-color="#f6cf7c" stop-opacity="0"/></radialGradient>
    <clipPath id="r"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="128" height="128" fill="url(#sky)"/>
    <circle cx="82" cy="58" r="30" fill="url(#sun)"/>
    <path d="M0 78 Q30 62 58 72 T128 66 V128 H0Z" fill="#6b4a2c"/>
    <path d="M0 96 Q40 80 74 90 T128 86 V128 H0Z" fill="#4a3220"/>
    <!-- 굽은 길 -->
    <path d="M70 128 C66 112 92 104 84 94 C78 86 62 88 66 80" fill="none" stroke="#f3d79a" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <!-- 발자국 -->
    <g fill="#3a2414" opacity=".75"><ellipse cx="72" cy="118" rx="2.2" ry="3.2" transform="rotate(-20 72 118)"/><ellipse cx="78" cy="110" rx="2.2" ry="3.2" transform="rotate(-35 78 110)"/><ellipse cx="85" cy="101" rx="2" ry="3" transform="rotate(-10 85 101)"/></g>
    <!-- 순례자: 지팡이를 짚고 길을 오른다 -->
    <g fill="#1d140c">
      <circle cx="44" cy="66" r="6"/>
      <path d="M36 74 Q44 70 52 74 L56 104 Q44 108 32 104Z"/>
      <path d="M33 74 Q28 80 30 90 L34 90 Z"/>
    </g>
    <path d="M56 70 L50 108" stroke="#1d140c" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
