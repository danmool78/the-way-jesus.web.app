<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut,user-scalable=no">
<title>그 길 — 순례 게임 | 걸어서 만나는 예수</title>
<meta name="description" content="이름을 넣고 나만의 순례자를 꾸며, 지도 위를 걸어 예수님이 계신 다음 장면을 찾아가는 게임.">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<meta name="theme-color" content="#15110d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#15110d;--panel:rgba(29,24,19,.86);--line:rgba(217,180,106,.28);--ink:#f1e8d8;--muted:#b3a58f;--faint:#7f735f;--gold:#d9b46a;--gold2:#f0d79a;--bad:#e07a62;--ok:#8fbf7a;--serif:'Gowun Batang',serif;--sans:'Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#world{position:fixed;inset:0;display:block;width:100%;height:100%}
.hidden{display:none!important}

/* 순례자 꾸미기 */
#setup{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:1fr minmax(320px,420px);background:radial-gradient(ellipse at 30% 40%,#2a2117,#110d09 70%)}
#setup .stagebox{position:relative;min-height:0}
#preview{position:absolute;inset:0;width:100%;height:100%}
#setup .stagebox .nameplate{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font:700 22px var(--serif);color:var(--gold2);text-shadow:0 2px 8px #000;white-space:nowrap}
#setup .panel{overflow:auto;padding:22px 22px 28px;background:var(--panel);border-left:1px solid var(--line);touch-action:pan-y}
#setup h1{margin:0 0 2px;font:700 26px var(--serif);color:var(--gold2)}
#setup .lead{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.6;word-break:keep-all}
.field{margin:0 0 14px}
.field>label,.field>b{display:block;margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
#name{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#0f0c09;color:var(--ink);font:500 16px var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#1d1813;font-size:13px}
.chips button.on{background:var(--gold);color:#1a140d;border-color:var(--gold);font-weight:700}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.15);padding:0}
.sw button.on{border-color:var(--gold2);box-shadow:0 0 0 2px #110d09,0 0 0 4px var(--gold2)}
.sw button.none{background:repeating-linear-gradient(45deg,#3a3026 0 4px,#1d1813 4px 8px)}
.go{width:100%;margin-top:6px;padding:14px;border:0;border-radius:12px;background:linear-gradient(#e6c67e,#c99d4e);color:#1a140d;font:700 16px var(--sans)}
.go.ghost{margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--gold2);font-weight:500;font-size:14px;padding:11px}
.back{display:inline-block;margin-top:14px;color:var(--faint);font-size:12.5px;text-decoration:none}
@media (max-width:760px){#setup{grid-template-columns:1fr;grid-template-rows:38vh 1fr}#setup .panel{border-left:0;border-top:1px solid var(--line)}#setup h1{font-size:22px}}

/* 게임 머리판 */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:10px;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none}
.mission{flex:1;max-width:520px;margin:0 auto;padding:9px 14px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px);text-align:center}
.mission small{display:block;font-size:11px;letter-spacing:.08em;color:var(--gold)}
.mission b{display:block;margin-top:2px;font:700 17px/1.35 var(--serif);color:var(--ink);word-break:keep-all;text-wrap:balance}
.mission #mClue{display:block;margin-top:2px;font:italic 12.5px/1.4 var(--serif);color:var(--muted);word-break:keep-all;text-wrap:balance}
.mission .meta{display:flex;justify-content:center;gap:10px;white-space:nowrap;margin-top:5px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));padding:7px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;pointer-events:none;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:15px;color:var(--gold2)}
#waterBox{left:12px}#dayBox{right:12px}
#water{display:block;letter-spacing:2px;font-size:16px}
#water i{display:inline-block;width:11px;height:15px;margin:0 1px;border-radius:5px 5px 6px 6px;background:linear-gradient(#9fd3ef,#3f8fc0);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
#water i.empty{background:#3a3026;box-shadow:none}
@media (max-width:760px){.mission{margin:0 74px}.mission b{font-size:15px}.stat{padding:6px 8px}}

/* 방향 화살표: 목표가 화면 밖이면 가장자리에 */
#arrow{position:fixed;z-index:4;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;transition:opacity .3s}
#arrow.lure svg circle{stroke:#e07a62}#arrow.lure svg path{fill:#ff8a6a}
.card p.tempt{color:#ff9a7a}
#arrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}

/* 이름표·장소 표 */
.tag{position:fixed;z-index:3;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;font:700 13px var(--serif);color:#fff6df;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.6)}
.tag.me{font:600 12px var(--sans);color:var(--gold2)}
.tag.goal{font-size:15px;color:var(--gold2)}
.tag.place{font:500 11.5px var(--serif);color:rgba(255,246,223,.75)}

/* 조이스틱 */
#stick{position:fixed;z-index:6;left:calc(26px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:rgba(20,16,11,.45);border:1px solid var(--line);touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f0d79a,#b9893e);box-shadow:0 3px 10px rgba(0,0,0,.5)}
@media (hover:hover) and (pointer:fine){#stick{opacity:.55}}

/* 말씀 카드 */
#cardsBtn{position:fixed;z-index:6;right:calc(12px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));padding:7px 11px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
#cardsBtn b{color:var(--gold2);font-size:14px}
#quit{position:fixed;z-index:6;left:calc(12px + env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 64px);padding:7px 11px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
#sound{position:fixed;z-index:6;left:calc(12px + env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 104px);padding:7px 11px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
#sound.off{opacity:.6;text-decoration:line-through}
/* 달리기: 폰에서 누르는 동안 (PC는 Shift — 마우스가 있는 화면에서는 감춘다) */
#run{position:fixed;z-index:6;left:calc(160px + env(safe-area-inset-left));bottom:calc(40px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:rgba(20,16,11,.55);color:var(--gold2);font-size:12.5px;touch-action:none;user-select:none;-webkit-user-select:none}
#run.on{background:rgba(217,180,106,.35)}
@media (hover:hover) and (pointer:fine){#run{display:none}}
/* 만난 뒤 둘러보다가 준비되면 */
#goWord{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));padding:12px 26px;border-radius:99px;border:0;background:linear-gradient(#f0d79a,#c99a4a);color:#2a1f14;font:700 16px var(--serif);box-shadow:0 6px 20px rgba(0,0,0,.45)}
#bubble .more{font-style:normal;margin-left:6px;color:#b98b45;font-size:12px}
#ask{position:fixed;z-index:6;right:calc(12px + env(safe-area-inset-right));bottom:calc(86px + env(safe-area-inset-bottom));padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--gold2)}
/* 등불: 가까울수록 밝게 (--w 0~1) */
#mDist{--w:0;padding-left:16px;position:relative}
#mDist::before{content:'';position:absolute;left:0;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#ffd77a;opacity:calc(.2 + var(--w) * .8);box-shadow:0 0 calc(2px + var(--w) * 14px) calc(var(--w) * 4px) rgba(255,215,122,calc(var(--w) * .9))}
#cardsBtn small{display:block;font-weight:700;color:#ffd77a;font-variant-numeric:tabular-nums}
.tpt{font:800 3.6cqw var(--sans);color:#ffd77a;letter-spacing:.02em}
.card small.got{margin:2px 0 6px;color:#ffd77a;font-weight:700;letter-spacing:.04em}
.card blockquote.won{border-left-color:#ffd77a;background:linear-gradient(90deg,rgba(255,215,122,.16),rgba(255,215,122,.04));box-shadow:0 0 0 1px rgba(255,215,122,.25)}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:4px 0 12px}
.wcard{position:relative;display:flex;flex-direction:column;gap:4px;min-height:150px;padding:10px 10px 9px;border-radius:10px;border:1px solid rgba(255,215,122,.35);background:linear-gradient(160deg,#3a2d1c,#221a11);text-align:left;color:var(--ink)}
.wcard small{font-size:10.5px;color:var(--gold)}
.wcard b{font:700 13.5px/1.3 var(--serif);color:var(--gold2);word-break:keep-all}
.wcard q{flex:1;font:12.5px/1.5 var(--serif);color:var(--ink);quotes:none;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.wcard cite{font:11px var(--sans);color:var(--muted);font-style:normal}
.wcard.lock{align-items:center;justify-content:center;border-style:dashed;border-color:var(--line);background:#15110d}
.wcard.lock small{position:absolute;left:10px;top:9px}
.wcard.lock b{font-size:30px;color:#3a3026}
/* 트레이딩 카드: 63:88, 등급(동·은·금) 테두리, 기울이면 홀로그램 빛 */
.cardview{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(360px,100%);max-height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:4px 2px 8px;touch-action:pan-y}
.cardview .row{width:100%;display:flex;gap:8px}.cardview .row .go{margin-top:0}.cardview .row a.go{text-align:center;text-decoration:none;display:block}
.gotcard{margin:0;font:700 15px var(--serif);color:#ffd77a;text-shadow:0 2px 8px #000;text-align:center}
.tcard{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--edge:linear-gradient(135deg,#7a4a26,#d9955a 30%,#6e3f1f 55%,#c98a4e 80%,#5a3418);position:relative;width:100%;aspect-ratio:63/88;border-radius:4.6%/3.3%;padding:3.2%;background:var(--edge);box-shadow:0 14px 40px rgba(0,0,0,.55);transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease-out;container-type:inline-size}
.tcard.silver{--edge:linear-gradient(135deg,#8d969e,#eef2f4 28%,#7b848c 52%,#dfe5ea 78%,#6a737a)}
.tcard.gold{--edge:linear-gradient(135deg,#9a6a1c,#ffe9a6 26%,#b8862a 50%,#fff2c4 74%,#8a5c14)}
.tin{position:relative;height:100%;display:flex;flex-direction:column;border-radius:3.4%/2.4%;overflow:hidden;background:linear-gradient(#1b2433,#121822);color:#f4ecdc}
.thead{display:flex;align-items:center;gap:3cqw;padding:2.6cqw 3.4cqw 2.2cqw}
.tno{flex:none;font:700 4.2cqw var(--sans);color:#151b26;background:#e9d9b0;border-radius:99px;padding:.5cqw 2cqw}
.thead b{flex:1;min-width:0;font:700 5.2cqw/1.2 var(--serif);word-break:keep-all;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} /* 긴 제목은 두 줄로 (말줄임 대신) */
.tst{flex:none;font-size:4.4cqw;color:#ffd77a;letter-spacing:.3cqw}
.tart{position:relative;margin:0 3cqw;flex:1;min-height:0;border-radius:2cqw;overflow:hidden;box-shadow:inset 0 0 0 .6cqw rgba(255,255,255,.18)}
.tart img{width:100%;height:100%;object-fit:cover;display:block}
.tcap{margin:1.6cqw 3cqw 0;padding:1cqw 2.4cqw;border-radius:1.4cqw;background:rgba(233,217,176,.12);font:500 3.3cqw var(--sans);color:#c9bfa8;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tword{margin:1.8cqw 3cqw 0;padding:2.6cqw 3.2cqw;border-radius:2cqw;background:#f3ead6;color:#2a2116}
.tword q{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;quotes:none;font:500 4.3cqw/1.5 var(--serif);word-break:keep-all;text-wrap:balance}
.tword cite{display:block;margin-top:1cqw;font:600 3cqw var(--sans);color:#8a6a3a;font-style:normal}
.tfoot{display:flex;justify-content:space-between;padding:2cqw 3.6cqw 2.6cqw;font:500 2.9cqw var(--sans);color:#8f9bb0;letter-spacing:.04em}
.tholo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;opacity:.0;transition:opacity .3s;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 42%),linear-gradient(115deg,transparent 20%,rgba(255,120,200,.35) 38%,rgba(120,220,255,.35) 50%,rgba(255,240,120,.35) 62%,transparent 80%);background-size:100% 100%,200% 200%;background-position:center,var(--mx) var(--my)}
.tcard.silver .tholo{opacity:.25}.tcard.gold .tholo{opacity:.4}
/* 보물 카드: 희귀도별 보석 테두리 — 보통(비취)·귀함(사파이어)·전설(무지개, 늘 빛이 흐름) */
.ttcard.common{--edge:linear-gradient(135deg,#2f6b5a,#a8e0c8 28%,#2a5e50 52%,#8fd0b6 78%,#20483d)}
.ttcard.rare{--edge:linear-gradient(135deg,#1d3f8a,#a9cbff 26%,#2a4fa8 50%,#d6e6ff 74%,#183375)}
.ttcard.legend{--edge:linear-gradient(135deg,#ff7ac8,#ffd36e 20%,#7af0c8 40%,#7ab8ff 60%,#c77aff 80%,#ff7ac8);background-size:200% 200%;animation:legend 4s linear infinite}
@keyframes legend{to{background-position:200% 200%}}
.ttcard .tno{background:#f3ead6}.ttcard.rare .tst{color:#a9cbff}.ttcard.common .tst{color:#a8e0c8}.ttcard.legend .tst{color:#ffb3f0}
.ttcard.rare .tholo{opacity:.35}.ttcard.legend .tholo{opacity:.6}
.ttcard .tin{background:linear-gradient(#1d1830,#121022)}
.thd{margin:14px 0 2px;font:700 17px var(--serif);color:var(--gold2)}
.deck .slot.tlock{padding:6px;gap:4px}.deck .slot.tlock i{font:normal 10.5px/1.35 var(--sans);color:var(--muted);text-align:center;word-break:keep-all}
.deck .slot.tlock em{font:normal 700 10px var(--sans);color:#ffd77a}
.deck .slot.tlock.rare{border-color:#4a6aa8}.deck .slot.tlock.legend{border-color:#b06ab0}
.deck .slot.tlock.rare small{color:#a9cbff}.deck .slot.tlock.legend small{color:#ffb3f0}
/* 장(카드 모음·장면 카드)을 위아래로 넘길 때 스크롤바가 눈에 거슬려 감춘다 (사용자 2026-11) */
#sheet *{scrollbar-width:none}#sheet *::-webkit-scrollbar{display:none}
.tcard.big:hover .tholo{opacity:.9}
.tcard.reveal{animation:reveal 1s cubic-bezier(.2,.8,.2,1)}
@keyframes reveal{0%{transform:perspective(900px) rotateY(180deg) scale(.6);opacity:0}60%{opacity:1}100%{transform:perspective(900px) rotateY(0) scale(1)}}
.deck .slot{padding:0;border:0;background:none}
.deck .slot .tcard{box-shadow:0 4px 12px rgba(0,0,0,.45)}
.deck .slot.lock{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:63/88;border-radius:8px;border:1px dashed var(--line);background:#15110d;position:relative}
.deck .slot.lock small{position:absolute;left:8px;top:6px;font-size:10.5px;color:var(--faint)}
.deck .slot.lock b{font-size:28px;color:#3a3026}
/* 알림 */
#mTime{color:var(--gold2);font-weight:700}#mTime.gold{color:#ffd77a}#mTime.silver{color:#dfe5ea}#mTime.bronze{color:#d9955a}#mTime.hurry{color:#ff9a7a;animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.45}}
/* 만남의 말풍선: 그분 머리 위에 */
#bubble{position:fixed;z-index:7;width:max-content;max-width:min(300px,78vw);transform:translate(-50%,calc(-100% - 14px)) scale(.92);padding:11px 15px 12px;border-radius:16px;background:#fbf3e0;color:#2a1f14;font:500 15.5px/1.6 var(--serif);word-break:keep-all;text-wrap:balance;box-shadow:0 8px 28px rgba(0,0,0,.45);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
body.meeting #stick,body.meeting #run,body.meeting #arrow{opacity:0!important;pointer-events:none}
#bubble.on{opacity:1;transform:translate(-50%,calc(-100% - 14px)) scale(1)}
#bubble::after{content:'';position:absolute;left:calc(50% + var(--tx,0px));bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fbf3e0}
#bubble b{display:block;font:700 11.5px var(--sans);letter-spacing:.06em;color:#9b6b2a;margin-bottom:2px}
#toast{position:fixed;z-index:8;left:50%;top:32%;transform:translate(-50%,-50%) scale(.9);max-width:88%;padding:14px 20px;border-radius:14px;background:rgba(40,18,12,.92);border:1px solid rgba(224,122,98,.55);color:#ffe7dc;font:700 16px/1.5 var(--serif);text-align:center;word-break:keep-all;text-wrap:balance;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.good{background:rgba(20,32,16,.92);border-color:rgba(143,191,122,.6);color:#eaffdf}
#toast small{display:block;margin-top:4px;font:500 12.5px var(--sans);opacity:.85}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
#dust{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,rgba(214,180,120,0),rgba(196,152,90,.55));opacity:0;transition:opacity .8s}
#dust.on{opacity:1}

/* 장면 카드·퀴즈·끝 */
#listen{position:fixed;inset:0;z-index:40;background:#000}
#listen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#listenClose{position:absolute;z-index:1;right:calc(10px + env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)));width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:rgba(255,255,255,.75);font-size:20px;line-height:1}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,6,4,.55);backdrop-filter:blur(3px)}
.card{width:min(460px,100%);max-height:calc(100% - 20px);overflow-y:auto;overflow-x:hidden;border-radius:18px;background:#1d1813;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);touch-action:pan-y}
.card .img{position:relative;aspect-ratio:16/10;background:#2a2117 center/cover}
.card .img .stars{position:absolute;right:12px;bottom:10px;font-size:22px;letter-spacing:2px;color:#ffd77a;text-shadow:0 2px 6px #000}
.card .body{padding:16px 18px 18px}
.card small{display:block;font-size:11.5px;letter-spacing:.08em;color:var(--gold)}
.card h2{margin:3px 0 2px;font:700 22px/1.35 var(--serif);color:var(--gold2);word-break:keep-all;text-wrap:balance}
.card .sub{margin:0 0 10px;color:var(--muted);font-size:13.5px;word-break:keep-all}
.card p.story{margin:0 0 10px;font:16px/1.75 var(--serif);word-break:keep-all}
.card blockquote{margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--gold);background:rgba(217,180,106,.08);font:15px/1.65 var(--serif);color:var(--ink);word-break:keep-all}
.card blockquote cite{display:block;margin-top:3px;font:12px var(--sans);color:var(--muted);font-style:normal}
.card .row{display:flex;gap:8px}
.card .row .go{margin-top:6px}
.card .row a.go{text-align:center;text-decoration:none;display:block}
.card .leg{display:flex;justify-content:space-between;margin:0 0 12px;padding:8px 12px;border-radius:10px;background:#15110d;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .leg b{color:var(--gold2)}
.quiz .opts{display:grid;gap:8px;margin:12px 0 0}
.quiz .opts button{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#15110d;text-align:left;font-size:15px}
.quiz .opts button.right{background:#24361c;border-color:var(--ok)}
.quiz .opts button.wrong{background:#3a1d16;border-color:var(--bad)}
.quiz .explain{margin:10px 0 0;color:var(--muted);font-size:13.5px;line-height:1.6;word-break:keep-all}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="dust"></div>

<!-- 순례자 꾸미기: 이름과 인형 (이 기기에만 기억 — theway-game-me) -->
<section id="setup">
  <div class="stagebox"><canvas id="preview"></canvas><div class="nameplate" id="plate"></div></div>
  <div class="panel">
    <h1>그 길 순례</h1>
    <p class="lead">나만의 순례자를 꾸미고 지도 위를 걸어, 예수님이 계신 다음 장면을 찾아가세요. 길을 잃으면 벌칙이 있어요.</p>
    <div class="field"><label for="name">순례자 이름</label><input id="name" maxlength="10" autocomplete="off" placeholder="이름을 넣어 주세요"></div>
    <div class="field"><b>모습</b><div class="chips" data-k="sex"></div></div>
    <div class="field"><b>얼굴빛</b><div class="sw" data-k="skin"></div></div>
    <div class="field"><b>머리카락</b><div class="sw" data-k="hair"></div></div>
    <div class="field"><b>수염</b><div class="chips" data-k="beard"></div></div>
    <div class="field"><b>속옷</b><div class="sw" data-k="robe"></div></div>
    <div class="field"><b>겉옷</b><div class="sw" data-k="mantle"></div></div>
    <div class="field"><b>머리에</b><div class="chips" data-k="head"></div></div>
    <div class="field"><b>지팡이</b><div class="chips" data-k="staff"></div></div>
    <button class="go" id="start">길 떠나기</button>
    <button class="go ghost hidden" id="restart">처음부터 다시 걷기</button>
    <button class="go ghost" id="seeCards">모은 말씀 카드 보기</button>
    <a class="back" href="app.html">← 그 길 앱으로</a>
  </div>
</section>

<header id="hud" class="hidden">
  <div class="mission"><small id="mNo"></small><b id="mTitle"></b><span id="mClue"></span><div class="meta"><span id="mTime" hidden></span><span id="mDist"></span><span id="mWalk"></span></div></div>
</header>
<div class="stat hidden" id="waterBox"><span id="water"></span>물병</div>
<div class="stat hidden" id="dayBox"><b id="days">0</b>일째</div>
<div id="arrow" class="hidden"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="21" fill="rgba(29,24,19,.8)" stroke="#d9b46a" stroke-width="1.5"/><path d="M23 9 L33 29 L23 24 L13 29 Z" fill="#f0d79a"/></svg></div>
<div id="tags"></div>
<div id="stick" class="hidden"><i></i></div>
<button id="cardsBtn" class="hidden"></button>
<button id="ask" class="hidden">길 묻기</button>
<button id="run" class="hidden">달리기</button>
<button id="goWord" class="hidden">말씀 고르기</button>
<button id="quit" class="hidden" aria-label="나가기">나가기</button>
<button id="sound" class="hidden">소리 켬</button>

<div id="toast"></div>
<div id="bubble"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="listen" class="hidden"><iframe title="이 장면 듣기" allow="autoplay; fullscreen"></iframe><button id="listenClose" aria-label="닫기">×</button></div>

<script type="module" src="game.js"></script>
