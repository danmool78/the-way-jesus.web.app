     예전 주소(/?j=moses, /#e05, /?lang=en#e05 등)는 앱으로 그대로 넘긴다 -->

<style>
:root{--bg:#16120e;--ink:#efe6d6;--muted:#b3a692;--faint:#8a7d6b;--serif:'Gowun Batang',serif;--sans:'Noto Sans KR',system-ui,sans-serif;
  --gold:#d9b46a;--gold2:#f0d79a;--gold-rgb:217,180,106}
/* 여정마다의 색 (앱 style.css의 [data-journey]와 같게) */
[data-journey=moses]{--gold:#dc8f5f;--gold2:#f3c29c;--gold-rgb:220,143,95}
[data-journey=david]{--gold:#a9bf6a;--gold2:#d6e3a8;--gold-rgb:169,191,106}
[data-journey=kings]{--gold:#b99ade;--gold2:#ddcdf3;--gold-rgb:185,154,222}
[data-journey=paul]{--gold:#70b5da;--gold2:#bbdff3;--gold-rgb:112,181,218}
[data-journey=psalms]{--gold:#5fb3a5;--gold2:#b5e0d8;--gold-rgb:95,179,165}
[data-journey=proverbs]{--gold:#d98fb0;--gold2:#f2c8da;--gold-rgb:217,143,176}
[data-journey=goodnews]{--gold:#e58a7f;--gold2:#f4c3bb;--gold-rgb:229,138,127}
[data-journey=why]{--gold:#d97a6c;--gold2:#f2c4b8;--gold-rgb:217,122,108}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100svh;color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;background:transparent}
/* 지도는 화면에 붙은 한 장으로 깔고, 위는 비치게·아래로 갈수록 어둡게 — 내려도 중간에 끊긴 데가 없다 */
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 80% 60% at 50% 18%,rgba(22,18,14,.55),rgba(22,18,14,.9) 70%),linear-gradient(rgba(22,18,14,.2),rgba(22,18,14,.75)),url(assets/relief.webp) center 30%/cover}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 18px 56px}
.lang{position:absolute;top:14px;right:16px}
.lang select{background:rgba(0,0,0,.35);color:var(--muted);border:1px solid #3a3026;border-radius:999px;padding:6px 12px;font:13px var(--sans)}
.lang select{color-scheme:dark}.lang option{background:#1b150f;color:#f0e6d0} /* 펼친 목록은 운영체제가 그려 반투명 바탕을 못 쓴다: 회색 바탕에 흐린 글씨가 되지 않게 어두운 바탕을 정해 준다 */
.hero{text-align:center;padding:72px 0 30px;animation:in .9s ease-out both}
.hero img{width:96px;height:96px}
.hero h1{margin:14px 0 4px;font:700 46px var(--serif);letter-spacing:.38em;text-indent:.38em;color:var(--gold2)}
.hero .tag{margin:0;font:18px var(--serif);color:var(--gold)}
.hero .lead{margin:16px auto 0;max-width:30em;color:var(--ink)}
h2{font:700 24px var(--serif);text-align:center;letter-spacing:.06em;color:var(--gold2);margin:40px 0 18px}
/* 여정 카드 */
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.card{display:grid;grid-template-columns:60px 1fr;grid-template-rows:1fr auto;gap:14px 16px;padding:18px;border:1px solid #3a3026;border-radius:18px;
  background:linear-gradient(160deg,rgba(var(--gold-rgb),.11),rgba(255,255,255,.015) 62%);animation:in .8s ease-out both}
.card.soon{background:rgba(255,255,255,.02)}
.card.soon .txt,.card.soon .icon{opacity:.72}
.icon{width:60px;height:60px;border-radius:15px;box-shadow:0 0 24px rgba(var(--gold-rgb),.28)}
.txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.txt b{font:700 19px var(--serif);color:var(--gold2)}
.txt small{font-size:13.5px;line-height:1.5;color:var(--muted)}
.txt em{font-style:normal;font-size:12px;letter-spacing:.04em;color:var(--gold);margin-top:2px}
.btns{grid-column:1/-1;display:flex;gap:8px}
.go{flex:1;display:inline-flex;justify-content:center;align-items:center;padding:11px 14px;border-radius:999px;background:var(--gold);color:#1b140c;font:600 14.5px var(--sans);text-decoration:none;white-space:nowrap;min-width:0}
.go.off{background:transparent;border:1px solid #4a3e30;color:var(--faint);cursor:default}
.share{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;border:1px solid rgba(var(--gold-rgb),.45);background:transparent;color:var(--gold2);font:13.5px var(--sans);cursor:pointer;white-space:nowrap;flex:none}
.share svg,.big svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.go:hover{filter:brightness(1.08)}.share:hover{background:rgba(var(--gold-rgb),.1)}
/* 주제가 뮤직비디오: 누르면 그 자리에서 재생 (처음부터 영상 창을 띄우지 않아 첫 화면이 가볍다) */
.mv{max-width:820px;margin:0 auto}
.mv p.lead{text-align:center;color:var(--muted);margin:-8px 0 16px}
.player{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:1px solid rgba(217,180,106,.35);box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 50px rgba(217,180,106,.12);background:#000}
.player button{all:unset;position:absolute;inset:0;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(rgba(10,8,6,0),rgba(10,8,6,.35)),url(assets/mv-poster.webp) center/cover}
.player button span{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:rgba(240,215,154,.92);box-shadow:0 0 0 10px rgba(240,215,154,.18);transition:transform .2s}
.player button:hover span{transform:scale(1.07)}
.player button svg{width:30px;height:30px;fill:#1b140c;margin-left:5px}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mv small{display:block;text-align:center;color:var(--faint);font-size:12px;margin-top:10px}
.mv small{transition:opacity 1.2s ease}.mv small.gone{opacity:0} /* AI 안내는 보인 뒤 5초 지나면 흐려져 사라진다 */
footer{text-align:center;margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:14px}
.big{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;border:1px solid rgba(217,180,106,.5);background:transparent;color:var(--gold2);font:14.5px var(--sans);cursor:pointer}
footer a{color:var(--muted);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2a2219;border:1px solid #4a3e30;color:var(--ink);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:600px){.hero{padding-top:58px}.hero h1{font-size:40px}.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.hero,.card{animation:none}}
.scene-lists{margin-top:18px;font-size:12.5px;line-height:2;color:var(--faint);text-align:center}.scene-lists a{color:var(--muted);text-decoration:none}.scene-lists a:hover{color:var(--gold2)} /* 여정별 장면 목록(s/) — 검색엔진이 장면 페이지로 따라 들어가는 글 링크 */
.prog{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--gold2)}.prog b{display:block;width:70px;height:4px;border-radius:2px;background:rgba(var(--gold-rgb),.22);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)} /* 시편처럼 만들고 있는 여정: 진행 막대와 n% (다 차면 build.py가 빼서 사라진다) */
</style>

<body>
<div class="lang"><select id="lang" aria-label="언어"></select></div>
<main class="wrap">
  <section class="hero">
    <img src="assets/logo.svg" alt="" width="96" height="96">
    <h1 data-i="appName">그 길</h1>
    <p class="tag" data-i="hubTag">지도 위에서 걷는 성경의 길</p>
    <p class="lead" data-i="hubLead">여정을 골라 성경의 장면을 지도 위에서 만나 보세요.</p>

  <section>
    <h2 data-i="seriesHead">그 길 시리즈</h2>

    <h2 data-i="mvGo">주제가 「그 길」 뮤직비디오</h2>

    <div class="player" id="player"><button type="button" id="play" aria-label="재생"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5Z"/></svg></span></button></div>

    <a id="qna" href="qna.html" data-i="qnaHelp">도움말 · 묻고 답하기</a>

<script>
// 'AI로 만들고 사람이 다듬었습니다' 안내: 화면에 들어온 뒤 5초 지나면 사라진다 (알릴 것은 알리되 계속 남아 있지 않게)
(() => {
  const n = document.querySelector('.mv small'); if (!n) return;
  const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); setTimeout(() => n.classList.add('gone'), 5000); } });
  io.observe(n);
})();
</script>
<div class="toast" id="toast" role="status"></div>
<script>
// 글씨·여정 목록은 land.json(build.py가 만든다 — 앱의 큰 data.json 대신). 언어는 앱과 같은 열쇠(theway-lang)를 쓴다
const SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.3 10.8 7.4-4.4M8.3 13.2l7.4 4.4"/></svg>';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
let L, U;
const t = (k, v = {}) => (U[k] ?? L.ui.ko[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => v[n] ?? '');
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
const SITE = 'https://thewaymap.org'; // 공유는 어느 주소에서 열었든 공식 주소로
async function share(url, title) {
  if (navigator.share) { try { await navigator.share({ title, url }); } catch { /* 공유 창을 닫음 */ } return; }
  try { await navigator.clipboard.writeText(url); toast(t('linkCopied')); } catch { prompt(t('shareApp'), url); }
}
function render(lang) {
  U = L.ui[lang] || L.ui.ko;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  document.getElementById('qna').href = lang === 'ko' ? 'qna.html' : `qna.${lang}.html`;
  // 언어마다 따로 둔 페이지('왜 기독교인가' why.html → why.en.html …)
  const hrefOf = c => c.langHref && lang !== 'ko' ? c.href.replace(/\.html$/, `.${lang}.html`) : c.href;
  document.getElementById('cards').innerHTML = L.cards.filter(c => !c.langs || c.langs.includes(lang)).map((c, i) => `<li class="card ${c.ready ? '' : 'soon'}" data-journey="${c.id}" style="animation-delay:${0.1 + i * 0.07}s">
    <img class="icon" src="${c.icon || (c.id === 'jesus' ? 'assets/icon.svg' : `j/${c.id}/icon.svg`)}" alt="" width="60" height="60">
    <div class="txt"><b>${esc(t(c.title))}</b><small>${esc(t(c.desc))}</small>${c.n ? `<em>${esc(t(c.id === 'psalms' ? 'seriesPsalms' : 'seriesScenes', { n: c.n }))}</em>` : ''}${c.progress ? `<span class="prog"><b><i style="width:${c.progress}%"></i></b><span>${esc(t('inProgress', { p: c.progress }))}</span></span>` : ''}</div>
    <div class="btns">${c.ready ? `<a class="go" href="${hrefOf(c) || `/app.html?j=${c.id}`}">${esc(t(c.go || 'seriesGo'))} →</a><button type="button" class="share" data-id="${c.id}">${SHARE}<span>${esc(t('shareShort'))}</span></button>`
      : `<span class="go off">${esc(t('soon'))}</span>`}</div></li>`).join('');
  // 단추 글씨는 한 줄로: 언어마다 길이가 달라('Walk this journey →'가 두 줄로 꺾였다) 넘치면 글자를 조금씩 줄인다 (사용자, 2026-11)
  requestAnimationFrame(fitBtns);
  // 여정마다의 공유 주소(/jesus, /moses — 그 여정의 미리보기 카드). 4영리처럼 따로 만든 페이지는 그 주소(href)
  document.querySelectorAll('.share[data-id]').forEach(b => b.onclick = () => { const c = L.cards.find(x => x.id === b.dataset.id); share(SITE + (hrefOf(c) || `/${c.id}`), `${t('appName')} — ${t(c.title)}`); });
}
function fitBtns() {
  document.querySelectorAll('.go, .share').forEach(b => { b.style.fontSize = ''; let f = parseFloat(getComputedStyle(b).fontSize); while (b.scrollWidth > b.clientWidth + 1 && f > 10) b.style.fontSize = (f -= 0.5) + 'px'; });
}
addEventListener('resize', () => requestAnimationFrame(fitBtns));
document.fonts?.ready.then(() => requestAnimationFrame(fitBtns)); // 웹 글꼴이 늦게 들어오면 글자가 넓어져 다시 맞춘다
fetch('land.json').then(r => r.json()).then(d => {
  L = d;
  const pick = l => l && d.langs.find(x => x === l || x === l.slice(0, 2));
  let saved = null; try { saved = localStorage.getItem('theway-lang'); } catch { /* 사생활 보호 모드 */ }
  const lang = pick(new URLSearchParams(location.search).get('lang')) || pick(saved) || (navigator.languages || [navigator.language]).map(pick).find(Boolean) || 'en';
  const sel = document.getElementById('lang');
  const names = { ko: '한국어', en: 'English', es: 'Español', pt: 'Português', fr: 'Français', zh: '中文', id: 'Bahasa Indonesia', ja: '日本語' };
  sel.innerHTML = d.langs.map(l => `<option value="${l}"${l === lang ? ' selected' : ''}>${names[l] || l}</option>`).join('');
  sel.onchange = () => { try { localStorage.setItem('theway-lang', sel.value); } catch { /* 무시 */ } render(sel.value); };
  render(lang);
});
document.getElementById('shareAll').onclick = () => share(SITE + '/', t('appName'));
