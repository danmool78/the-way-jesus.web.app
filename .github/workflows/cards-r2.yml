name: Card art to R2
# 순례 게임의 3D 인물 모델(_src/models/*.glb → assets/models.json의 열쇠)도 같은 버킷 models/에 함께 올린다
# 말씀 카드 그림(_src/cards/out — 배포에서 빠지는 곳)을 R2 버킷 theway의 cards/에 올린다: 호스팅 전송량을 아끼려고(사용자 2026-11).
# 열쇠는 assets/cards.json(내용 해시가 붙은 이름)이 정한다 — 이미 공개 주소에 있는 것은 건너뛴다. 가지마다 돌아 PR 미리보기에서도 그림이 보인다
on:
  push:
    paths: ['_src/cards/out/**', 'assets/cards.json', '_src/models/**', 'assets/models.json', '.github/workflows/cards-r2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload missing card images
        run: |
          python3 - <<'PY' > /tmp/todo.txt
          # 이미 있는지 한꺼번에 묻는다. User-Agent를 꼭 붙인다 — 파이썬 기본 이름은 r2.dev가 403으로 막아, 늘 '없다'고 보고
          # 카드 194장·모델 57개를 매번 다시 올리느라 10분 넘게 걸렸다(사용자 2026-11: 파일 하나 올리는데 왜 이리 오래)
          import json, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          m = json.load(open('assets/cards.json'))
          def missing(kv):
              try: urllib.request.urlopen(urllib.request.Request(m['base'] + '/' + kv[1], method='HEAD', headers={'User-Agent': 'theway-r2-check'}), timeout=20); return None
              except Exception: return kv
          for r in ThreadPoolExecutor(24).map(missing, m['files'].items()):
              if r: print(*r)
          PY
          echo "올릴 그림: $(wc -l < /tmp/todo.txt)장"
          while read -r k key; do
            npx --yes wrangler@4 r2 object put "theway/$key" --file "_src/cards/out/$k.webp" --content-type image/webp --cache-control "public, max-age=31536000, immutable" --remote
          done < /tmp/todo.txt
      - name: Upload missing 3D models
        run: |
          python3 - <<'PY' > /tmp/todo-m.txt
          import json, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          m = json.load(open('assets/models.json'))
          def missing(kv):
              try: urllib.request.urlopen(urllib.request.Request(m['base'] + '/' + kv[1], method='HEAD', headers={'User-Agent': 'theway-r2-check'}), timeout=20); return None
              except Exception: return kv
          for r in ThreadPoolExecutor(24).map(missing, m['files'].items()):
              if r: print(*r)
          PY
          echo "올릴 모델: $(wc -l < /tmp/todo-m.txt)개"
          while read -r k key; do
            npx --yes wrangler@4 r2 object put "theway/$key" --file "_src/models/$k.glb" --content-type model/gltf-binary --cache-control "public, max-age=31536000, immutable" --remote
          done < /tmp/todo-m.txt
