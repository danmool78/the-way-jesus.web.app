name: Deploy to Firebase Hosting on merge
on:
  push:
    branches: [main]
permissions:
  contents: write
# 관리자 페이지에서 연달아 고쳐도 하나씩 차례로 (녹음·커밋이 서로 엇갈리지 않게)
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 이 커밋이 아니라 지금의 main을 받는다: 먼저 끝난 작업이 올린 data·녹음 위에서 이어 가게 (몰려온 작업은 마지막 것만 돈다)
      - uses: actions/checkout@v4
        with:
          ref: main
      # 관리자 페이지(admin.html)는 _src만 고쳐 올린다: 여기서 data를 다시 만들고, 읽을 문장이 바뀐 장면의
      # 녹음을 새로 만들어(_src/tools/voice.mjs changed) main에 함께 올린다. 이 커밋은 GITHUB_TOKEN으로 올리므로
      # 이 작업을 다시 부르지 않는다
      - name: Rebuild data and narration after an admin edit
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cp data.json "$RUNNER_TEMP/old-data.json"
          python3 _src/build.py
          if git diff --quiet; then exit 0; fi
          if [ -n "$GOOGLE_TTS_KEY" ]; then
            command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
            node _src/tools/voice.mjs changed "$RUNNER_TEMP/old-data.json"
            # 시편: 작업실에서 노래 앞 낭독을 고치면 바뀐 문장만 새로 녹음한다 (all은 녹음이 이미 있는 문장을 건너뛴다)
            if ! git diff --quiet -- j/psalms; then node _src/tools/voice.mjs --j psalms all; fi
          else
            echo "::warning::GOOGLE_TTS_KEY 비밀값이 없어 녹음은 새로 만들지 않았습니다 (그 장면은 브라우저 음성으로 읽힙니다)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # build.py가 만드는 것은 모두 담는다 — land.json(시편 진행률이 노래를 올릴 때마다 바뀐다)·llms.txt와
          # seo.py가 머리를 다시 쓰는 랜딩·qna·why가 빠져 있어, 그것만 바뀐 때는 담을 것이 없다며 배포가 실패했다
          git add -A data*.json land.json llms.txt index.html qna*.html why*.html assets/voice s sitemap.xml
          if [ -d j ]; then git add -A j; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild data and narration after an admin edit"
          git pull --rebase -q origin main && git push origin HEAD:main
      # 시편 노래에 자리 표(Xing 헤더)를 붙여 R2에 다시 올린다 — 없으면 아이폰이 일시정지 뒤 재생 위치를 잘못 셈해 가사 싱크가 틀어졌다.
      # 이미 붙인 노래(seek: true)는 건너뛴다. R2에 못 올리면(토큰 권한 등) 경고만 남기고 배포는 그대로
      - name: Add seek headers to psalm songs
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          ls assets/psalms/*.json >/dev/null 2>&1 || exit 0
          command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          node _src/tools/xing.mjs
          git add -A assets/psalms
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Psalms: add seek headers to songs"
          if git pull --rebase -q origin main; then git push origin HEAD:main; else git rebase --abort; git reset -q --hard HEAD~1; echo "새로 올라온 노래가 있어 이번엔 건너뜀"; fi
      # 시편 노래 작업실(studio.html)에서 노래를 R2에 올리면 assets/psalms/<id>.json이 by: pending으로 올라온다: 그 노래를 받아
      # 가사 줄마다 부르기 시작하는 시각을 맞춰 함께 올린다. 맞출 노래가 없으면 아무 일도 하지 않는다
      - name: Sync psalm lyrics to the uploaded songs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ls assets/psalms/*.json >/dev/null 2>&1 || exit 0
          command -v ffprobe >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          node _src/tools/lyricsync.mjs
          git add -A assets/psalms
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync psalm lyrics to the uploaded songs"
          # 맞추는 사이 작업실에서 노래를 또 바꿨으면 이 결과는 낡았다 — 버리고 배포는 그대로 (뒤따르는 배포가 새 노래를 맞춘다)
          if git pull --rebase -q origin main; then git push origin HEAD:main; else git rebase --abort; git reset -q --hard HEAD~1; echo "새로 올라온 노래가 있어 이번 맞춤은 건너뜀"; fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THE_WAY_JESUS }}
          channelId: live
          projectId: the-way-jesus
