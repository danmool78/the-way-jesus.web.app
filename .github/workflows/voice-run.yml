# 여정 낭독 녹음 (_src/tools/voice.mjs): 이 브랜치에서 _src/voice-run/<여정> 파일을 바꿔 push하면 그 여정의 녹음이 없는 문장만
# 새로 녹음해 같은 브랜치에 커밋한다. GOOGLE_TTS_KEY는 GitHub 비밀값에만 있다. 운영 배포와 상관없다 (병합해야 배포)
name: Journey narration
on:
  push:
    branches: ['claude/**']
    paths: ['_src/voice-run/**']
  workflow_dispatch:
    inputs:
      journey: { description: '여정 (예: proverbs)', required: true, default: proverbs }
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # ffmpeg 설치가 패키지 서버에서 멎어 30분 넘게 걸린 적이 있다 — 시간 제한을 걸고, 멎으면 한 번 더 시도한다
      - name: ffmpeg
        timeout-minutes: 12
        run: |
          command -v ffmpeg && exit 0
          for t in 1 2; do
            timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -q &&
            timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -q --no-install-recommends ffmpeg && exit 0
          done
          exit 1
      - name: Record
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          INPUT_J: ${{ github.event.inputs.journey }}
        run: |
          python3 _src/build.py
          # 트리거 파일의 이름이 여정 (손으로 돌리면 입력값). 이미 녹음한 문장은 건너뛰므로 모두 돌려도 새 문장만 녹음된다
          JS="$INPUT_J"
          [ -n "$JS" ] || JS=$(ls _src/voice-run)
          for j in $JS; do
            w=""; [ "$(jq -r '.journey.where' "j/$j/data.json")" = "false" ] || w=walks
            node _src/tools/voice.mjs --j "$j" all $w
          done
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A assets/voice data*.json j s sitemap.xml
          # 녹음하는 동안 같은 브랜치에 다른 커밋이 올라올 수 있어, 받아 얹은 뒤 올린다
          git commit -m "Record journey narration" && (git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}") || echo "nothing to commit"
