<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<base href="/">
<title>왜 기독교인가 — 유튜브 표지</title>
<!-- 유튜브 표지(1280×720). 휴대폰 목록의 작은 그림에서도 읽히게 글씨는 크고 적게. 찍기: Playwright로 열어 1280×720 캡처 -->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:720px;overflow:hidden}
  .t{position:relative;width:1280px;height:720px;background:radial-gradient(ellipse 70% 90% at 78% 40%,#fff8ec 0%,#f3e9d8 70%,#ecdfc9 100%)}
  .art{position:absolute;right:-30px;top:20px;width:720px;height:700px;background:url(assets/img/why/mountain.webp) center/cover;mix-blend-mode:multiply;filter:contrast(1.15) saturate(1.25);
    -webkit-mask:radial-gradient(ellipse 62% 66% at 55% 52%,#000 58%,transparent 80%);mask:radial-gradient(ellipse 62% 66% at 55% 52%,#000 58%,transparent 80%)}
  .tx{position:absolute;left:72px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
  .logo{display:flex;align-items:center;gap:12px;font-family:'Gowun Batang',serif;font-size:30px;letter-spacing:.3em;color:#b04537;margin-bottom:30px}
  .logo img{width:44px;height:44px}
  h1{margin:0;font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:92px;line-height:1.18;color:#221d17;letter-spacing:-.02em}
  h1 em{font-style:normal;color:#c0453a}
  .sub{margin:34px 0 0;font-family:'Gowun Batang',serif;font-weight:700;font-size:40px;color:#7a3a2e}
  .sub b{display:inline-block;margin-left:10px;padding:4px 18px;border-radius:30px;background:#c0453a;color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:26px;vertical-align:6px}
</style>
</head>
<body>
<div class="t">
  <div class="art"></div>
  <div class="tx">
    <div class="logo"><img src="assets/logo.svg" alt="">그 길</div>
    <h1>모든 종교는<br><em>같은 말</em>을 할까?</h1>
    <p class="sub">왜 기독교인가 <b>10분</b></p>
  </div>
</div>
</body>
</html>
