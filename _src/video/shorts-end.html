<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<!-- 쇼츠(shorts.cjs) 끝 화면: 로고 · 이름 · 주소 -->
<style>
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 38%,#3a2a16 0%,#17110a 60%,#0d0906 100%);color:#f4ead6;font-family:'Noto Sans KR',sans-serif;overflow:hidden}
.box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0}
img{width:118px;height:118px;filter:drop-shadow(0 6px 26px rgba(240,200,120,.35));animation:up 1s ease-out both}
h1{font-family:'Gowun Batang',serif;font-size:58px;letter-spacing:.32em;margin:22px 0 4px .32em;animation:up 1s .15s ease-out both}
.sub{font-size:16px;color:#d9c49a;letter-spacing:.06em;animation:up 1s .3s ease-out both}
.url{margin-top:44px;font-size:30px;font-weight:800;color:#fff;letter-spacing:.01em;padding:12px 26px;border-radius:999px;background:linear-gradient(135deg,#c99a45,#e8c27a);color:#1a1208;animation:up 1s .5s ease-out both}
.tags{margin-top:22px;font-size:15px;color:#cdbb98;letter-spacing:.04em;animation:up 1s .7s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style></head><body><div class="box">
<img src="../../assets/logo.svg" alt="">
<h1>그 길</h1>
<div class="sub">성경을 지도 위에서 걷다</div>
<div class="url">thewaymap.org</div>
<div class="tags">무료 · 설치 없이 · 8개 언어</div>
</div></body></html>
