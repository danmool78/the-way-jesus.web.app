# 그 길 관리자 Worker — 올리기는 .github/workflows/worker.yml (비밀값 GH_TOKEN은 그 작업이 넣는다)
name = "theway-admin"
main = "admin-worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "theway"

# 여정·장면 방문 기록 (/hit) — visits.mjs가 SQL API로 읽어 관리자 페이지에 띄운다
[[analytics_engine_datasets]]
binding = "HITS"
dataset = "theway_hits"

[vars]
# 들어올 수 있는 구글 계정 이메일의 SHA-256(소문자) — 쉼표로 여럿. 이메일을 그대로 적지 않으려고 해시로
ALLOWED = "88b40ab6359f98ac9945ec970a4729dc797e27ddb3878f16e6ea91f1611e394a"
